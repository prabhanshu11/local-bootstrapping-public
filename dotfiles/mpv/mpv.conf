# Hardware-accelerated decode via Intel iGPU (VA-API)
hwdec=auto-safe
vo=gpu

# Resume where you left off (2026-10-03, mpv-history): quitting (q or closing the
# window) saves the position in ~/.local/state/mpv/watch_later; reopening the
# same file resumes there. The filename is written into each entry so it is
# readable. History of what was watched: scripts/mpv-history.lua.
save-position-on-quit=yes
write-filename-in-watch-later-config=yes
