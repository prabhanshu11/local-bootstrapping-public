[Unit]
# Wait for voice-gateway to be ready before starting hyprwhspr
After=voice-gateway.service
Wants=voice-gateway.service
# Cascade gateway restart/stop to hyprwhspr — the Python WebSocket client
# does NOT survive a gateway restart (connection breaks, reconnect exhausts,
# then all recordings silently produce no transcription).
PartOf=voice-gateway.service

[Service]
Environment=XDG_RUNTIME_DIR=/run/user/1000
Environment=YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket
Environment=WAYLAND_DISPLAY=wayland-1
Environment=HYPRWHSPR_ROOT=/usr/lib/hyprwhspr
Environment=PYTHONUNBUFFERED=1
# CRITICAL: Set PYTHONPATH with patch dir FIRST
# The original launcher script prepends system lib, which breaks our patches
# So we run Python directly to ensure our patches load first
Environment=PYTHONPATH=/home/prabhanshu/.local/lib/hyprwhspr-patch:/usr/lib/hyprwhspr/lib
# Override ExecStart to use patched main.py with MicOSD integration
ExecStart=
ExecStart=/usr/bin/python /home/prabhanshu/.local/lib/hyprwhspr-patch/main.py
