# Desktop only (installed by setup-voice-typing.sh on non-ThinkPad hosts).
# The desktop's Jabra EVOLVE at 59 % gain produces RMS 30-90 for speech, below
# the gateway's default silence gate of 100, so speech was being skipped as
# silence. Broken BT mics send zero-filled frames (RMS 0-5), so 10 still catches those.
# Was an uncommitted source edit on the desktop from 2026-04-04 to 2026-09-30.
[Service]
Environment=SILENCE_RMS_THRESHOLD=10
