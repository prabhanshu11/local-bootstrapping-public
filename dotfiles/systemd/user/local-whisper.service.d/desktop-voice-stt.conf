# Desktop only (RTX 2060 SUPER). Serve the fine-tuned model; `current` is a
# symlink to the model chosen by the last training round (see
# omarchy-voice-typing/docs/local-stt.md). The laptop runs the base + distil hybrid
# (the popup's "Source: Local" button); the desktop runs one model on its GPU, no hybrid.
[Service]
Environment=WHISPER_MODEL=%h/Programs/voice-stt/models/current
Environment=WHISPER_DEVICE=cuda
Environment=WHISPER_COMPUTE=int8_float16
Environment=WHISPER_CPU_THREADS=0
Environment=WHISPER_LONG_MODEL=
