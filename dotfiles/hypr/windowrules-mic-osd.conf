# MicOSD overlay positioning — Hyprland window rules approach
# Replaces gtk4-layer-shell; window.py sets app_id via GLib.set_prgname("mic-osd")
# These rules make the GTK4 window float at bottom-center of the laptop screen
#
# Coordinates: move 760 882 = (1920-400)/2, ~1080-68-130 (centers 400px wide window,
# positions near bottom above waybar on 1920x1080 screen)

windowrule = float true, match:class ^(mic-osd)$
windowrule = pin true, match:class ^(mic-osd)$
windowrule = size 400 68, match:class ^(mic-osd)$
windowrule = move 760 882, match:class ^(mic-osd)$
windowrule = no_focus true, match:class ^(mic-osd)$
windowrule = border_size 0, match:class ^(mic-osd)$
windowrule = no_shadow true, match:class ^(mic-osd)$
windowrule = no_anim true, match:class ^(mic-osd)$
windowrule = opacity 0.9 0.9, match:class ^(mic-osd)$
