# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Monitor chooser auto-popup-on-connect — DISABLED: the trigger script reads
# Hyprland's unix socket via bash redirection, which cannot work (needs socat),
# so it never fired and spammed a 20MB log. The chooser is still reachable via
# left-click on the waybar monitor widget.
# exec-once = ~/.config/hypr/scripts/monitor-chooser-trigger.sh

# Desktop icons
# dicons-keepalive restarts dicons after a crash (it segfaulted 2026-11-02, icons gone 4 days)
exec-once = ~/.local/bin/dicons-keepalive

# Unlock pass/GPG once per login (fingerprint); keeps the keystroke redaction index fresh
exec-once = ks-unlock --login

# Re-apply screen flip state after config reload (survives hyprctl reload)
exec = ~/.local/bin/screen-flip apply

# VDI: while the Windows window / Linux stream has focus, every key goes to it (bindings-streaming.conf vdi-pass)
exec-once = ~/.local/bin/vdi-keys watch
