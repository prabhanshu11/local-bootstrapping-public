# Voice typing binding (AssemblyAI via hyprwhspr)
# Uses hyprwhspr-toggle for robust paste handling (kills stale ydotool processes)
# Requires: hyprwhspr service, voice-gateway service, ydotool-layout
# NOTE: Full path required - ~/.local/bin not in Hyprland exec PATH
bindd = SUPER, grave, Voice typing, exec, $HOME/.local/bin/hyprwhspr-toggle
