# VDI: the desktop's headless display (Sunshine) streamed to the laptop (Moonlight)
# Full doc: ~/Programs/local-bootstrapping/docs/vdi.md
#
#   Super+Ctrl+D       no stream: the VDI intro screen (connection, destinations, desktop state, knobs;
#                      a tile connects); streaming: hide/show the stream (stays connected)
#                      The VDI bar (Home, route, release, fullscreen, stats, close) sits on top of
#                      the stream: fullscreen = the "VDI" tab over waybar (hover or a finger drops it); windowed = the grey
#                      arrow box on the stream window's left edge (click/tap = the sidebar).
#   Super+Ctrl+Escape  release: keyboard + mouse back to the laptop (focus jumps to the other monitor)
#   Super+Ctrl+X       fullscreen <-> window
#   Ctrl+Escape        close the stream
#   Super+Shift+S      screenshot a region to the clipboard (the Windows habit; was the VDI launcher)
#
# The four VDI keys use the `p` flag: they BYPASS Moonlight's keyboard-shortcuts-inhibit
# (--capture-system-keys always), so they work even while every other key goes to the desktop.
# Plain bindd keys are swallowed during a stream — that is why the old exits were unreliable.
# All actions log to ~/Programs/local-bootstrapping/logs/streaming-events.log.

bindpd = SUPER CTRL, D, VDI intro screen / hide / show, exec, ~/.local/bin/moonlight-toggle toggle
bindpd = SUPER CTRL, Escape, VDI release keyboard and mouse, exec, ~/.local/bin/moonlight-toggle release
bindpd = SUPER CTRL, X, VDI fullscreen toggle (stream or Windows window), exec, ~/.local/bin/moonlight-toggle fullscreen
bindpd = CTRL, Escape, VDI close stream, exec, ~/.local/bin/moonlight-toggle kill

bindd = SUPER SHIFT, S, Screenshot region to clipboard, exec, ~/.local/bin/screenshot-save smart clipboard

# ============================================================================
# DESKTOP CONTROLS (Sunshine server) - only useful on the desktop machine
# ============================================================================
bindd = SUPER SHIFT ALT, S, Sunshine Web UI, exec, xdg-open https://localhost:47990
bindd = SUPER SHIFT ALT CTRL, S, Restart Sunshine, exec, systemctl --user restart app-dev.lizardbyte.app.Sunshine.service && notify-send "Sunshine" "Restarted"

# The VDI window opens fullscreen; moonlight-toggle's place() moves it to the monitor chosen on the
# intro screen ("Show on: Laptop panel | External", prefs monitor=; 11-01 round 2). A fixed-monitor
# rule would not follow that setting, so there is none.
windowrule = fullscreen true, match:class ^(com\.moonlight_stream\.Moonlight)$
# Own workspaces (round 7, 2026-11-02; his words "I don't want both the setups mixing up"): the Linux
# stream lives on workspace 8, "Windows in its own window" (vdi-rdp, xfreerdp3 /wm-class:vdi-rdp) on 9.
# Opening either switches to its workspace; neither lands on his terminals or on the other.
# moonlight-toggle's VDI_WS must match the first rule.
windowrule = workspace 8, match:class ^(com\.moonlight_stream\.Moonlight)$
windowrule = workspace 9, match:class ^(vdi-rdp)$

# Keys inside the VDI (11-05, his "alt+tab, super+shift+S, super+right are not working inside the vdi"): while the
# Windows window or the Linux stream has focus, vdi-keys (autostart.conf) switches to this submap. It binds only the
# Super+Ctrl VDI keys, so Alt+Tab, Super+Shift+S, Super+arrows ... reach the VDI window instead of the laptop.
submap = vdi-pass
bindpd = SUPER CTRL, Escape, VDI laptop keys back (until the VDI window is focused again), exec, ~/.local/bin/vdi-keys release
bindpd = SUPER CTRL, D, VDI intro screen / hide / show, exec, ~/.local/bin/moonlight-toggle toggle
bindpd = SUPER CTRL, X, VDI fullscreen toggle (stream or Windows window), exec, ~/.local/bin/moonlight-toggle fullscreen
submap = reset
