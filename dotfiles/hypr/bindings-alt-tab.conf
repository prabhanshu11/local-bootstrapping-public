# Alt+Tab like Windows: most-recently-used order across the current desktop
# (both monitors of a workspace pair). Tap Alt+Tab = previous window; hold Alt
# and keep tapping Tab (or ←/→) to go deeper; release Alt to settle; Esc cancels.
# Overrides Omarchy's `cyclenext` Alt+Tab (tiling-v2.conf) — must be sourced after it.
# Logic lives in ~/.local/bin/hypr-alt-tab; see its header.
unbind = ALT, TAB
unbind = ALT, TAB
unbind = ALT SHIFT, TAB
unbind = ALT SHIFT, TAB

# Enter the submap from the bind itself (compositor-side, instant), so even a
# tap released before the script runs is caught by the release binds below.
# Order matters: binds after a `submap` dispatcher on the same key don't fire.
bindd = ALT, TAB, Switch to previous window (MRU), exec, ~/.local/bin/hypr-alt-tab start
bind = ALT, TAB, submap, alttab

submap = alttab
bind = ALT, TAB, exec, ~/.local/bin/hypr-alt-tab next
bind = ALT, right, exec, ~/.local/bin/hypr-alt-tab next
bind = ALT, left, exec, ~/.local/bin/hypr-alt-tab prev
bind = ALT, escape, exec, ~/.local/bin/hypr-alt-tab cancel
bindrt = ALT, ALT_L, exec, ~/.local/bin/hypr-alt-tab commit
bindrt = ALT, ALT_R, exec, ~/.local/bin/hypr-alt-tab commit
bindr = , ALT_L, exec, ~/.local/bin/hypr-alt-tab commit
bindr = , ALT_R, exec, ~/.local/bin/hypr-alt-tab commit
# Safety net: if an Alt release is ever missed, the next key press (Alt up) closes
# the switcher, so it can never trap the keyboard.
bind = , catchall, exec, ~/.local/bin/hypr-alt-tab commit
submap = reset
