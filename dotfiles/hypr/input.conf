# Control your input devices
# See https://wiki.hypr.land/Configuring/Variables/#input
input {
  # Use multiple keyboard layouts and switch between them with Alt+Shift
  # Layout 1: Dvorak, Layout 2: US QWERTY
  kb_layout = us,us
  kb_variant = dvorak,
  kb_options = grp:alt_shift_toggle

  # Change speed of keyboard repeat
  repeat_rate = 40
  repeat_delay = 600

  # Start with numlock on by default
  numlock_by_default = true

  # Touchpad/mouse acceleration and sensitivity
  accel_profile = adaptive
  sensitivity = 0.2

  touchpad {
    # Use natural (inverse) scrolling
    # natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    clickfinger_behavior = true

    # Control the speed of your scrolling
    scroll_factor = 0.8

    # Enable tap-to-click
    tap-to-click = true

    # Disable touchpad while typing to prevent accidental touches
    disable_while_typing = false
  }
}

# Pin the laptop touchscreen to the laptop panel. Unmapped, it spans the whole
# layout, so taps on the laptop's waybar landed on the external monitor.
device {
  name = elan-touchscreen
  output = eDP-1
}

# Per-device sensitivity (optional - device-specific overrides)
# device {
#   name = synaptics-tm3471-020
#   sensitivity = 0.2
# }

# Scroll nicely in the terminal
windowrule = scroll_touchpad 1.5, match:class (Alacritty|kitty)
windowrule = scroll_touchpad 0.2, match:class com.mitchellh.ghostty

# Enable touchpad gestures for changing workspaces
# See https://wiki.hyprland.org/Configuring/Gestures/
gesture = 3, horizontal, workspace

