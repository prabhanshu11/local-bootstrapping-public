# Super+W: close the active window, then focus the newest-opened window on this
# workspace, so rapid presses close windows in reverse opening order (predictable).
# Swap `opened` for `mru` to get Windows-style most-recently-used order instead.
# Overrides Omarchy's default `killactive` (tiling-v2.conf) — must be sourced after it.
unbind = SUPER, W
bindd = SUPER, W, Close window (opening order), exec, ~/.local/bin/hypr-close-ordered opened
