# Screenshot keys -> screenshot-save (dotfiles/local-bin/screenshot-save), 2026-11-06.
# His words: "when the screenshot button is pressed, and no area gets selected,
# the popup doesn't come up, instead the screenshot simply gets saved into the
# pictures folder ... from now on the screenshots get saved there" (~/Pictures/screenshots).
# Sourced from bindings.conf (after Omarchy's defaults and his own lines), so the
# unbinds below replace Omarchy's Print bindings and his Super+H ones.
# Super+Shift+S lives in bindings-streaming.conf and calls the same script.
# Touch: the bar's screenshot path is unchanged (none added here).

# Omarchy's own menu entries still run omarchy-cmd-screenshot: point them at the
# same folder. (Hyprland does not expand $HOME in env values.)
env = OMARCHY_SCREENSHOT_DIR,/home/prabhanshu/Pictures/screenshots

unbind = , PRINT
unbind = SHIFT, PRINT
unbind = SUPER, H
unbind = SUPER SHIFT, H
bindd = , PRINT, Screenshot (nothing selected = save whole screen), exec, ~/.local/bin/screenshot-save smart edit
bindd = SHIFT, PRINT, Screenshot to clipboard (nothing selected = save whole screen), exec, ~/.local/bin/screenshot-save smart clipboard
bindd = SUPER, H, Screenshot (nothing selected = save whole screen), exec, ~/.local/bin/screenshot-save smart edit
bindd = SUPER SHIFT, H, Screenshot to clipboard (nothing selected = save whole screen), exec, ~/.local/bin/screenshot-save smart clipboard
