# KDE-style virtual desktops spanning both monitors.
#
# Overrides Omarchy's per-monitor workspace binds (tiling-v2.conf, sourced
# earlier). Desktop N = workspace N on the external monitor + N+10 on the
# laptop panel, switched together by workspace-pair; workspace-pairs-daemon
# (systemd user service) keeps them in sync for swipes/waybar clicks and
# owns the workspace->monitor rules.
#
# NOTE: must be sourced AFTER the omarchy default bindings in hyprland.conf.

# --- Switch desktop: SUPER + [1-9, 0] ---------------------------------
unbind = SUPER, code:10
unbind = SUPER, code:11
unbind = SUPER, code:12
unbind = SUPER, code:13
unbind = SUPER, code:14
unbind = SUPER, code:15
unbind = SUPER, code:16
unbind = SUPER, code:17
unbind = SUPER, code:18
unbind = SUPER, code:19
bindd = SUPER, code:10, Switch to desktop 1, exec, ~/.local/bin/workspace-pair switch 1
bindd = SUPER, code:11, Switch to desktop 2, exec, ~/.local/bin/workspace-pair switch 2
bindd = SUPER, code:12, Switch to desktop 3, exec, ~/.local/bin/workspace-pair switch 3
bindd = SUPER, code:13, Switch to desktop 4, exec, ~/.local/bin/workspace-pair switch 4
bindd = SUPER, code:14, Switch to desktop 5, exec, ~/.local/bin/workspace-pair switch 5
bindd = SUPER, code:15, Switch to desktop 6, exec, ~/.local/bin/workspace-pair switch 6
bindd = SUPER, code:16, Switch to desktop 7, exec, ~/.local/bin/workspace-pair switch 7
bindd = SUPER, code:17, Switch to desktop 8, exec, ~/.local/bin/workspace-pair switch 8
bindd = SUPER, code:18, Switch to desktop 9, exec, ~/.local/bin/workspace-pair switch 9
bindd = SUPER, code:19, Switch to desktop 10, exec, ~/.local/bin/workspace-pair switch 10

# --- Move window to desktop: SUPER SHIFT + [1-9, 0] -------------------
# The window stays on its current monitor's half of the pair.
unbind = SUPER SHIFT, code:10
unbind = SUPER SHIFT, code:11
unbind = SUPER SHIFT, code:12
unbind = SUPER SHIFT, code:13
unbind = SUPER SHIFT, code:14
unbind = SUPER SHIFT, code:15
unbind = SUPER SHIFT, code:16
unbind = SUPER SHIFT, code:17
unbind = SUPER SHIFT, code:18
unbind = SUPER SHIFT, code:19
bindd = SUPER SHIFT, code:10, Move window to desktop 1, exec, ~/.local/bin/workspace-pair move 1
bindd = SUPER SHIFT, code:11, Move window to desktop 2, exec, ~/.local/bin/workspace-pair move 2
bindd = SUPER SHIFT, code:12, Move window to desktop 3, exec, ~/.local/bin/workspace-pair move 3
bindd = SUPER SHIFT, code:13, Move window to desktop 4, exec, ~/.local/bin/workspace-pair move 4
bindd = SUPER SHIFT, code:14, Move window to desktop 5, exec, ~/.local/bin/workspace-pair move 5
bindd = SUPER SHIFT, code:15, Move window to desktop 6, exec, ~/.local/bin/workspace-pair move 6
bindd = SUPER SHIFT, code:16, Move window to desktop 7, exec, ~/.local/bin/workspace-pair move 7
bindd = SUPER SHIFT, code:17, Move window to desktop 8, exec, ~/.local/bin/workspace-pair move 8
bindd = SUPER SHIFT, code:18, Move window to desktop 9, exec, ~/.local/bin/workspace-pair move 9
bindd = SUPER SHIFT, code:19, Move window to desktop 10, exec, ~/.local/bin/workspace-pair move 10

# --- Move window silently: SUPER SHIFT ALT + [1-9, 0] -----------------
unbind = SUPER SHIFT ALT, code:10
unbind = SUPER SHIFT ALT, code:11
unbind = SUPER SHIFT ALT, code:12
unbind = SUPER SHIFT ALT, code:13
unbind = SUPER SHIFT ALT, code:14
unbind = SUPER SHIFT ALT, code:15
unbind = SUPER SHIFT ALT, code:16
unbind = SUPER SHIFT ALT, code:17
unbind = SUPER SHIFT ALT, code:18
unbind = SUPER SHIFT ALT, code:19
bindd = SUPER SHIFT ALT, code:10, Move window silently to desktop 1, exec, ~/.local/bin/workspace-pair movesilent 1
bindd = SUPER SHIFT ALT, code:11, Move window silently to desktop 2, exec, ~/.local/bin/workspace-pair movesilent 2
bindd = SUPER SHIFT ALT, code:12, Move window silently to desktop 3, exec, ~/.local/bin/workspace-pair movesilent 3
bindd = SUPER SHIFT ALT, code:13, Move window silently to desktop 4, exec, ~/.local/bin/workspace-pair movesilent 4
bindd = SUPER SHIFT ALT, code:14, Move window silently to desktop 5, exec, ~/.local/bin/workspace-pair movesilent 5
bindd = SUPER SHIFT ALT, code:15, Move window silently to desktop 6, exec, ~/.local/bin/workspace-pair movesilent 6
bindd = SUPER SHIFT ALT, code:16, Move window silently to desktop 7, exec, ~/.local/bin/workspace-pair movesilent 7
bindd = SUPER SHIFT ALT, code:17, Move window silently to desktop 8, exec, ~/.local/bin/workspace-pair movesilent 8
bindd = SUPER SHIFT ALT, code:18, Move window silently to desktop 9, exec, ~/.local/bin/workspace-pair movesilent 9
bindd = SUPER SHIFT ALT, code:19, Move window silently to desktop 10, exec, ~/.local/bin/workspace-pair movesilent 10

# --- Desktop cycling: SUPER [+SHIFT/+CTRL] TAB ------------------------
unbind = SUPER, TAB
unbind = SUPER SHIFT, TAB
unbind = SUPER CTRL, TAB
bindd = SUPER, TAB, Next desktop, exec, ~/.local/bin/workspace-pair next
bindd = SUPER SHIFT, TAB, Previous desktop, exec, ~/.local/bin/workspace-pair prev
bindd = SUPER CTRL, TAB, Former desktop, exec, ~/.local/bin/workspace-pair last
