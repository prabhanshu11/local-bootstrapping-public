# Hyprgrass touch gesture plugin (laptop touchscreen)
# Built via: ~/Programs/local-bootstrapping/scripts/setup-hyprgrass.sh
plugin = ~/.local/share/hypr/plugins/libhyprgrass.so

plugin {
  touch_gestures {
    sensitivity = 4.0
    workspace_swipe_fingers = 3
    emulate_touchpad_swipe = false
    resize_on_border_long_press = true
  }
}
