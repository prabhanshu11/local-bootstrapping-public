# Special keys (F9-F12 row on ThinkPad T14 Gen 1)
# These keys send XF86 keysyms instead of standard F9-F12
# Keysyms discovered via wev — see ~/Programs/utilities/README.md

bindd = , XF86NotificationCenter, Telegram, exec, omarchy-launch-or-focus-webapp Telegram "https://web.telegram.org/"
bindd = , XF86PickupPhone, Previous track, exec, playerctl previous
bindd = , XF86HangupPhone, Play/Pause, exec, playerctl play-pause
bindd = , XF86Favorites, Next track, exec, playerctl next

# Brightness keys
bindd = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl set +5%
bindd = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 5%-

# Physical power button: suspend if locked, otherwise show Omarchy's system menu.
unbind = , XF86PowerOff
bindld = , XF86PowerOff, Power, exec, $HOME/.local/bin/power-button-action
