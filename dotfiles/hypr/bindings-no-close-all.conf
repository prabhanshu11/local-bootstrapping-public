# Ctrl+Alt+Delete: NOTHING. Omarchy's tiling-v2.conf binds it to "Close all
# windows" (omarchy-hyprland-window-close-all), which on 2026-10-26 12:16 closed
# every terminal, browser and 8 Claude sessions in two seconds with no prompt.
# Must be sourced after tiling-v2.conf. close-all-guard also unbinds it live and
# deletes the script if an Omarchy update brings either back.
# See docs/issues/ctrl-alt-delete-closed-all-windows-2026-10-26.md
unbind = CTRL ALT, DELETE
