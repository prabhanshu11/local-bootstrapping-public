# ThinkPad T14 Gen 1: Set preferred audio profile on boot
#
# Without this config, WirePlumber fails to auto-select a profile for
# the Intel SOF HDA DSP card (api.acp.auto-profile=false), leaving it
# on profile "off" with no speaker/mic after reboot.
#
# The profile priority list tells WirePlumber which profile to select
# when no stored profile exists. First match wins.
#
# Profile names from: pw-dump | grep EnumProfile
#   idx=0: off
#   idx=1: HiFi (HDMI1, HDMI2, HDMI3, Headphones, Mic1, Mic2)
#   idx=2: HiFi (HDMI1, HDMI2, HDMI3, Mic1, Mic2, Speaker) ← preferred
#   idx=3: pro-audio

device.profile.priority.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic"
      }
    ]
    actions = {
      update-props = {
        priorities = [
          "HiFi (HDMI1, HDMI2, HDMI3, Mic1, Mic2, Speaker)"
          "HiFi (HDMI1, HDMI2, HDMI3, Headphones, Mic1, Mic2)"
          "pro-audio"
        ]
      }
    }
  }
]
