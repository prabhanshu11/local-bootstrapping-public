# Prevent "Auto 12" Bluetooth speaker from becoming default source
# This device (02:00:00:00:00:05) is output-only, has no microphone
# Disable source routing to prevent monitor/input from being default source

monitor.bluez.rules = [
  # Disable the output node's monitor from being a valid source
  {
    matches = [
      {
        node.name = "~bluez_output.02_00_00_00_00_06.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 0
        node.pause-on-idle = true
      }
    }
  }
  # Disable the HFP/HSP input (fake mic) from being a source
  {
    matches = [
      {
        node.name = "~bluez_input.02_00_00_00_00_06.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 0
        node.disabled = true
      }
    }
  }
]
