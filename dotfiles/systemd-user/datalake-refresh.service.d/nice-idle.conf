# datalake-refresh must not starve the star-trek-camera tracker on the desktop (star-trek-camera BOOK G6).
# Measured 2026-09-27 04:26 -> 09-30 01:52 on the desktop (tracker cycles.jsonl, whole minutes):
#   no refresh running  n=2356 min  median 1.85 c/s, p10 1.55
#   VACUUM INTO phase   n=645 min   median 1.62 c/s, p10 1.02   <- the 23 GB snapshot copy
#   scp phase           n=715 min   median 1.83 c/s, p10 1.53
# Nice + idle IO only take the CPU/IO-queue share; the dirty-page writeback of the 23 GB copy is not
# attributed to this process (star-trek-camera docs/DAY-2026-09-25.md:298), so this is a partial fix.
# The real fix (incremental sync instead of a full VACUUM INTO every run) is specced in
# star-trek-camera docs/night-0930/hygiene-0930-REPORT.md §G6.
[Service]
Nice=19
IOSchedulingClass=idle
