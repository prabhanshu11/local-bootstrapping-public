[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Markers for filtering tests by level
markers =
    unit: Fast unit tests (no external dependencies)
    integration: Integration tests (require running services)
    visual: Visual regression tests (require GUI and API key)
    acceptance: Full acceptance tests (require complete system)
    slow: Tests that take more than 10 seconds

    reboot: Post-reboot verification
    config_wipe: Post-config-recovery verification
    fresh_install: Post-fresh-install verification

    desktop: Desktop-specific tests
    laptop: Laptop-specific tests

# Default options
addopts = -v --tb=short

# Ignore certain directories
norecursedirs = .git fixtures results screenshots
