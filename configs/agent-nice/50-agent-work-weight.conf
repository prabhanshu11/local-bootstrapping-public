# Installed as /etc/systemd/system/session-.scope.d/50-agent-work-weight.conf (all login-session scopes).
# Agent lanes reach the desktop over ssh, and every ssh login is its own session-N.scope cgroup.
# Nice only orders threads INSIDE one cgroup, so a niced lane still got a full weight-100 share against
# the star-trek-camera tracker and the GUI (both in user@1000.service); nine lanes = nine shares.
# Weight 1 is the cgroup equivalent of nice 19: lanes still use every idle core, but under contention
# the tracker and the GUI come first. The GUI itself does not live in a session scope on either machine
# (uwsm runs Hyprland under user@1000.service), so this does not slow the desktop you look at.
# Need full priority for one job (e.g. a benchmark)? Run it as
#   systemd-run --user --scope --quiet <cmd>
# which moves it into user@1000.service/app.slice at the default weight.
[Scope]
CPUWeight=1
