// Firefox AutoConfig (local-bootstrapping configs/firefox-autoconfig/firefox.cfg)
// FIRST LINE MUST STAY A COMMENT: Firefox skips it.
//
// 1. Middle-click on a tab must NOT close it (his ask, 2026-10-23).
//    Firefox 151 hard-codes this in tabbrowser/tabs.js on_click
//    (event.button == 1 -> gBrowser.removeTab); there is no pref, so a
//    capture-phase listener on the tab strip swallows the event first.
//    Middle-click on links (open in new tab) and on the empty strip
//    (new tab) are untouched.
try {
  const S = globalThis.Services
    ?? ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;

  const blockMiddleCloseTab = (win) => {
    const doc = win.document;
    if (doc.documentURI !== "chrome://browser/content/browser.xhtml") return;
    const strip = doc.getElementById("tabbrowser-tabs");
    if (!strip || strip._noMiddleClose) return;
    strip._noMiddleClose = true;
    const swallow = (e) => {
      if (e.button !== 1) return;
      if (e.target?.closest("tab") || e.target?.closest("tab-group-label")) {
        e.stopPropagation();
        e.preventDefault();
      }
    };
    strip.addEventListener("click", swallow, true);
    strip.addEventListener("auxclick", swallow, true);
    strip.addEventListener("mouseup", swallow, true);
  };

  // Windows already open (unlikely at autoconfig time) + every new one.
  for (const w of S.wm.getEnumerator("navigator:browser")) blockMiddleCloseTab(w);
  S.obs.addObserver({ observe: (win) => blockMiddleCloseTab(win) },
                    "browser-delayed-startup-finished");
} catch (e) {
  Cu.reportError?.("firefox.cfg: no-middle-close-tab failed: " + e);
}
