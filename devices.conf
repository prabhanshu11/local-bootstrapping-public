# Device Configuration for Local Bootstrapping
# Format: name:tailscale_ip:description[:lan_ip]
#
# Add new devices here as you acquire them.
# These are used by setup-ssh.sh for key exchange and SSH config aliases.
#
# lan_ip is optional and generates an extra "<name>-lan" SSH alias, used as a
# fallback when Tailscale is down. Both machines share the hostname "omarchy",
# so mDNS cannot disambiguate them (omarchy.local resolves to self) - hence a
# literal address. Set a DHCP reservation on the router for these to be stable.

# Current devices
#
# 2026-09-17: the two lan_ip values were stale and had effectively swapped.
# 192.168.0.103 is the LAPTOP's current address, so "ssh desktop-lan" from the
# laptop dialled the laptop itself. Corrected to the intended assignment:
# desktop .102 (pending a DHCP reservation on the Archer C6 for enp4s0 MAC
# 02:00:00:00:00:01), laptop .103. See
# docs/issues/desktop-offline-2026-09-15-c50-bridge.md.
#
# NOTE: setup-ssh.sh only *appends* a "<name>-lan" block when one is absent, so
# it will not rewrite an existing stale alias. To pick these up, delete the
# "Host desktop-lan" and "Host laptop-lan" blocks from ~/.ssh/config, then
# re-run scripts/setup-ssh.sh.
# 2026-09-24: .102 is the Archer C50 bridge itself; the desktop (enp4s0 behind the C50)
# was .126 (verified by ssh + host key); .103 since the 2026-09-25 reboot, RESERVED on the C6 (slot 3, 2026-09-25). Laptop LAN = the USB dongle on home-wifi-5g,
# DHCP .104 (reserved on the C6 2026-09-24). docs/issues/home-lan-unreachable-when-internet-down-2026-09-24.md
desktop:100.64.0.1:Desktop PC (omarchy):192.168.0.103
laptop:100.64.0.2:Laptop (omarchy):192.168.0.104

