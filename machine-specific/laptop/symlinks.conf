# Laptop-only links, overlaid on install.sh SYMLINKS by scripts/lib/reconcile.sh
# ("src:dst"; src relative to this directory, or absolute / ~-prefixed).
#
# Datalake: the laptop runs the datalake repo's own web unit (python -m web.app,
# port 5050, active) and CLI, not the local-bootstrapping copies the desktop
# links. Recorded as-is 2026-09-30 so the self-heal changes nothing here;
# unifying the two datalake-web units is an open decision
# (docs/issues/desktop-drift-2026-09-30.md).
~/Programs/datalake/scripts/datalake-web.service:~/.config/systemd/user/datalake-web.service
~/Programs/datalake/bin/get-recent-user-messages:~/.local/bin/get-recent-user-messages
#
