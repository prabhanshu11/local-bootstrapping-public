# Desktop-only links, overlaid on install.sh SYMLINKS by scripts/lib/reconcile.sh
# ("src:dst"; src relative to this directory; same dst = replaces the common entry).
#
# monitors.conf: the repo's dotfiles/hypr/monitors.conf is the LAPTOP layout
# (DP-2 Samsung + eDP-1). The desktop drives one HDMI monitor at 2x plus a
# headless output for Sunshine streaming (live name HEADLESS-1; the HEADLESS-2
# line in monitors.conf matches nothing). Captured verbatim 2026-09-30.
hypr/monitors.conf:~/.config/hypr/monitors.conf
# autostart.conf: creates the headless output Sunshine streams from. The laptop
# copy's dicons (not installed here) and screen-flip (ThinkPad eDP-1 + elan
# touchscreen only) do not apply. Captured verbatim 2026-09-30.
hypr/autostart.conf:~/.config/hypr/autostart.conf
# windowrules-wall.conf: HDMI-A-1 is the Star Trek wall (kiosk fullscreen on
# workspace 1, terminals/agents/keyring prompts on workspace 2). Sourced from
# bindings.conf by LB_HYPR_SOURCES_GATED in scripts/lib/reconcile.sh.
# See docs/wall-guard.md.
hypr/windowrules-wall.conf:~/.config/hypr/windowrules-wall.conf
# Sunshine (VDI server): base config + apps tracked here since 2026-11-01. output_name
# picks HEADLESS-1 (the VDI display) instead of the wall. sunshine.conf itself is NOT
# linked: vdi-knob renders it from the base + knobs (ExecStartPre drop-in below). docs/vdi.md.
systemd/sunshine-vdi-knobs.conf:~/.config/systemd/user/app-dev.lizardbyte.app.Sunshine.service.d/vdi-knobs.conf
sunshine/apps.json:~/.config/sunshine/apps.json
# vdi-vm LAN RDP proxy (Windows VMs reachable from the laptop's vdi-rdp, LAN + wg-vdi only). docs/vdi.md.
systemd/vdi-vm-rdp-proxy.service:~/.config/systemd/user/vdi-vm-rdp-proxy.service
# vdi-vm keeper: the Windows VM stays up ("started mode"), paused when memory is short. docs/vdi.md.
systemd/vdi-vm-keeper.service:~/.config/systemd/user/vdi-vm-keeper.service
