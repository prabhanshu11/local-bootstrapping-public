# Extra autostart processes
# exec-once = uwsm-app -- my-service
# Named explicitly (DESKTOP-AWAY-1101): an unnamed output takes the next HEADLESS-<n> counter,
# and Sunshine (output_name), vdi-vm and the window rules all select HEADLESS-1 by name.
# With the name fixed, booting with the HDMI cable unplugged cannot rename the VDI display.
exec-once = hyprctl output create headless HEADLESS-1

# Lock screen immediately on boot (security layer for TPM auto-unlock)
# This ensures physical access requires password while SSH still works
# exec-once = sleep 2 && hyprlock

# VDI mouse reach (docs/vdi.md round 7): HEADLESS-1 at 0x0 while it is the only monitor (wall unplugged),
# beside the wall otherwise; Sunshine's absolute mouse assumes the layout starts at x=0.
exec-once = ~/Programs/local-bootstrapping/dotfiles/local-bin/vdi-headless-origin watch
