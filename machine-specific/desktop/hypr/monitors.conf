# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,2
monitor=,preferred,auto,auto

# The wall (Dell P2422H) pinned at the origin, so the headless output never pushes it.
monitor = HDMI-A-1, preferred, 0x0, 1
# VDI display (Headless, created by autostart.conf; Sunshine streams it by name, see
# machine-specific/desktop/sunshine/sunshine.conf). Scale 1 = 1920x1080 logical, matching
# the laptop panel it is shown on; the auto scale (2) made it 960x540. 2026-11-01, docs/vdi.md.
monitor = HEADLESS-1, 1920x1080@60, 1920x0, 1
# 1920x0 needs the wall at 0x0. With the wall unplugged, vdi-headless-origin (autostart.conf) moves it
# to 0x0: Sunshine's absolute mouse assumes the layout starts at x=0 (round 7, 2026-11-02).

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.6

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2