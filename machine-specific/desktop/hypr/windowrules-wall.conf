# The wall: HDMI-A-1 is an ambient display owned by the Star Trek kiosk.
# Desktop only (linked by machine-specific/desktop/symlinks.conf, sourced from
# bindings.conf by scripts/lib/reconcile.sh LB_HYPR_SOURCES_GATED).
# His words 2026-10-01: "those terminals should start in desktops 2, 3 etc";
# the wall owns the whole screen. wall-guard (dotfiles/local-bin/wall-guard,
# every 2 min) enforces the same for windows that already exist and applies
# these rules at runtime when this file is not sourced. Doc: docs/wall-guard.md.
# Hyprland 0.53+ block syntax (0.56.2 on the desktop).

# Kiosk Chromium --app window: /kiosk on :8100 today, / on :8101 (the wall) next.
# Class only: static rules are evaluated at map time, before the page title loads.
windowrule {
    name = wall-kiosk
    match:class = ^chrome-127\.0\.0\.1__(kiosk)?-Default$
    monitor = HDMI-A-1
    workspace = 1
    fullscreen = true
    border_size = 0
    no_anim = true
}

# lb-drift's Claude agent terminal (it also execs with [workspace 2 silent]).
windowrule {
    name = wall-drift-agent-off-wall
    match:class = ^(local-bootstrapping\.drift-agent)$
    workspace = 2 silent
}

# Any terminal on the desktop starts on workspace 2 (HEADLESS-1, Sunshine).
windowrule {
    name = wall-terminals-off-wall
    match:class = ^(com\.mitchellh\.ghostty|ghostty)$
    workspace = 2 silent
}

# Keyring prompts never float over the wall.
windowrule {
    name = wall-keyring-off-wall
    match:class = ^(gcr-prompter)$
    workspace = 2
    float = true
}

# Windows VM on the VDI display (vdi-vm show windows): the desktop's xfreerdp3 session to the VM lives
# fullscreen on workspace 12 of HEADLESS-1; Linux stays on workspace 2. vdi-vm sets the same rules at
# runtime. docs/vdi.md "Windows VM".
workspace = 12, monitor:HEADLESS-1
windowrule {
    name = vdi-vm-rdp
    match:class = ^(vdi-vm)$
    workspace = 12 silent
    fullscreen = true
}
windowrule {
    name = vdi-vm-boot
    match:class = ^(vdi-vm\.boot)$
    workspace = 12 silent
}
