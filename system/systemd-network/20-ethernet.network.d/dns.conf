# DESKTOP-AWAY-1101 (2026-11-01): DNS that does not need the Pi.
# Static list replaces the DHCP one so the ORDER is ours: networkd lists static
# DNS= before DHCP-learned servers, so "add 1.1.1.1 and keep UseDNS" would have
# put 1.1.1.1 ahead of Pi-hole. Pi-hole (.2) stays first, the C6 (.1) second
# (both what DHCP hands out today), then 1.1.1.1 and 9.9.9.9 when both are gone.
# Installed at /etc/systemd/network/20-ethernet.network.d/dns.conf.
[Network]
DNS=192.168.0.2
DNS=192.168.0.1
DNS=1.1.1.1
DNS=9.9.9.9

[DHCPv4]
UseDNS=no
