# Realtek rtw88 driver — disable deep Low-Power Save
#
# The rtw88 driver's deep LPS mode can wedge the chip firmware such that
# `failed to leave lps state` + `failed to send h2c command` cascades
# render the radio silently deaf while the netdev still appears "up".
# Only a USB re-enumeration recovers it.
#
# Observed on: TP-Link Archer T2U PLUS (RTL8821AU, usb 5-1) on desktop,
# 2026-04-15. Full incident write-up: docs/rtl8821au-lps-wedge.md
#
# Harmless no-op on machines that don't load rtw88_core (e.g. laptop with
# Intel wifi) — modprobe only applies the option when the module loads.

options rtw88_core disable_lps_deep=Y
