# iwd configuration — deployed to /etc/iwd/main.conf
#
# Disable 802.11 power save on the Realtek rtw88 USB adapters.
#
# The TP-Link Archer T2U PLUS (RTL8821AU, rtw88_8821au) on the desktop is
# unreliable with power save on: it contributes to the firmware LPS wedge
# documented in docs/rtl8821au-lps-wedge.md and to association instability.
# /etc/modprobe.d/rtw88.conf already sets disable_lps_deep=Y at the driver
# level; this disables the 802.11-level power save iwd would otherwise enable.
#
# NOTE on syntax: the option is [DriverQuirks] PowerSaveDisable, and its value
# is a comma-separated list of driver names or glob matches — NOT a boolean.
# An earlier revision of the LPS doc suggested "[General] DisablePowerSave=true";
# that key does not exist and iwd silently ignores it. Verified against
# iwd.config(5) on 2026-08-29.
#
# The glob keeps this file safe to deploy everywhere: it matches the desktop's
# rtw88_8821au and is a no-op on the laptop's Intel iwlwifi.

[DriverQuirks]
PowerSaveDisable=rtw88*
