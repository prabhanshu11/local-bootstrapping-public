# Hibernate is the last resort when suspend fails at low battery (2026-10-06).
# platform = ACPI S4 (firmware knows it hibernated); shutdown = fallback if S4 is refused.
# Plain hibernate only: nvidia-hibernate.service saves VRAM; suspend-then-hibernate stays off.
# See docs/issues/laptop-hibernate-setup-2026-10-06.md
[Sleep]
AllowHibernation=yes
HibernateMode=platform shutdown
