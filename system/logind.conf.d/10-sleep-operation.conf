# logind's default SleepOperation is "suspend-then-hibernate suspend". On the
# laptop suspend-then-hibernate fails every time (the NVIDIA pre-suspend hook
# does not run on that path -> nv_pmops_suspend returns -5), and hibernate is
# not configured anyway. UPower's critical-battery action calls Sleep(), so it
# failed exactly when it mattered (2026-09-13, 2026-09-16).
# Plain suspend works. See docs/issues/laptop-low-battery-suspend.md
[Login]
SleepOperation=suspend
