# Hibernate resume hook (scripts/setup-hibernate.sh, 2026-10-06).
# A separate drop-in instead of an edit to omarchy_hooks.conf: an Omarchy update that rewrites
# that file cannot drop `resume`. Sourced after it (zz- sorts last); puts `resume` right after
# the busybox `encrypt` hook, once. See docs/issues/laptop-hibernate-setup-2026-10-06.md
if [[ " ${HOOKS[*]} " != *" resume "* ]]; then
    _hib_hooks=()
    for _hib_h in "${HOOKS[@]}"; do
        _hib_hooks+=("$_hib_h")
        if [[ $_hib_h == encrypt ]]; then
            _hib_hooks+=(resume)
        fi
    done
    HOOKS=("${_hib_hooks[@]}")
    unset _hib_hooks _hib_h
fi
