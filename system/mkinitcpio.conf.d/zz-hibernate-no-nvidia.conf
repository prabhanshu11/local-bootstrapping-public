# Keep the NVIDIA driver OUT of the boot image (scripts/setup-hibernate.sh, 2026-10-06).
#
# Incident 2026-10-06 22:30: `systemctl hibernate` wrote the image, the next power-on read it
# back ("PM: Image successfully loaded"), then the resume aborted:
#   nvidia 0000:2d:00.0: PM: pci_pm_freeze(): nv_pmops_freeze [nvidia] returns -5
#   PM: hibernation: Failed to load image, recovering.  PM: hibernation: resume failed (-5)
# and the laptop booted fresh. Cause: Omarchy's NVIDIA install puts
# MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm) in /etc/mkinitcpio.conf, so the boot
# kernel loads the NVIDIA driver in the initramfs BEFORE the `resume` hook. With
# NVreg_PreserveVideoMemoryAllocations=1 that driver refuses to freeze unless nvidia-sleep.sh
# drove /proc/driver/nvidia/suspend first, which cannot happen inside the initramfs, so the
# kernel cannot hand over to the restored image. (Same -5 as the 2026-09-17 suspend-then-hibernate.)
#
# The panel runs on the Intel iGPU (i915, added by the `kms` hook), so nothing at boot needs
# NVIDIA. After switch_root udev loads nvidia/nvidia_drm normally from the real root, and
# /etc/modprobe.d/nvidia.conf (nvidia_drm modeset=1) still applies there; nouveau stays
# blacklisted by nvidia-utils' modprobe.d file, which is also in the image.
#
# A drop-in (sourced after mkinitcpio.conf at every build) instead of an edit to
# mkinitcpio.conf: an Omarchy/NVIDIA update that rewrites MODULES cannot bring them back.
# See docs/issues/laptop-hibernate-setup-2026-10-06.md
_hib_mods=()
for _hib_m in "${MODULES[@]}"; do
    _hib_n=${_hib_m%\?}          # "nvidia?" = optional module syntax
    _hib_n=${_hib_n//-/_}        # nvidia-drm == nvidia_drm
    case $_hib_n in
        nvidia|nvidia_modeset|nvidia_uvm|nvidia_drm) ;;
        *) _hib_mods+=("$_hib_m") ;;
    esac
done
MODULES=("${_hib_mods[@]}")
unset _hib_mods _hib_m _hib_n
