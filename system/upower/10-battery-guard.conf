# UPower backstop below battery-guard (dotfiles/local-bin/battery-guard).
# 2026-10-06: 4% is the new zero (his words); the last resort is HIBERNATE, which needs RAM
# written to disk, so the action fires at 6%. Hibernate set up by scripts/setup-hibernate.sh.
# See docs/issues/laptop-hibernate-setup-2026-10-06.md and docs/issues/laptop-low-battery-suspend.md
[UPower]
UsePercentageForPolicy=true
PercentageLow=30.0
PercentageCritical=12.0
PercentageAction=6.0
CriticalPowerAction=Hibernate
